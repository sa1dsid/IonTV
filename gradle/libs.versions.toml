coroutines = "1.9.0"
zxing = "3.5.3"
robolectric = "4.14.1"
androidxTestCore = "1.6.1"
androidxTestExt = "1.3.0"
roborazzi = "1.60.0"
composablePreviewScanner = "0.8.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
